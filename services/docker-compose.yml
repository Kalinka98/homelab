x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  edge:
    external: true
    name: homelab-edge

  spotify:
    driver: bridge
    internal: true

services:
  actual:
    image: actualbudget/actual-server:26.10.0
    container_name: actual-budget
    restart: unless-stopped
    logging: *default-logging

    volumes:
      - ./actual/data:/data:Z

    expose:
      - "5006"

    networks:
      - edge

  vaultwarden:
    image: vaultwarden/server:1.37.3
    container_name: vaultwarden
    restart: unless-stopped
    logging: *default-logging

    environment:
      DOMAIN: "https://vault.${BASE_DOMAIN}"
      SIGNUPS_ALLOWED: "false"

    volumes:
      - ./vaultwarden/data:/data:Z

    networks:
      - edge

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0
    container_name: homepage
    restart: unless-stopped
    logging: *default-logging

    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.${BASE_DOMAIN}

      HOMEPAGE_AUTH_ENABLED: "true"
      HOMEPAGE_AUTH_SECRET: ${HOMEPAGE_AUTH_SECRET}
      HOMEPAGE_AUTH_PASSWORD: ${HOMEPAGE_AUTH_PASSWORD}
      HOMEPAGE_EXTERNAL_URL: https://home.${BASE_DOMAIN}

      HOMEPAGE_VAR_ADGUARD_USERNAME: ${ADGUARD_USERNAME}
      HOMEPAGE_VAR_ADGUARD_PASSWORD: ${ADGUARD_PASSWORD}

      HOMEPAGE_VAR_SONARR_KEY: ${SONARR_API_KEY}
      HOMEPAGE_VAR_RADARR_KEY: ${RADARR_API_KEY}
      HOMEPAGE_VAR_PROWLARR_KEY: ${PROWLARR_API_KEY}
      HOMEPAGE_VAR_BAZARR_KEY: ${BAZARR_API_KEY}
      HOMEPAGE_VAR_JELLYFIN_KEY: ${JELLYFIN_API_KEY}
      HOMEPAGE_VAR_HOMELABLE_KEY: ${HOMELABLE_API_KEY}
      HOMEPAGE_VAR_SPEEDTEST_APP_KEY: ${SPEEDTEST_API_KEY}
      HOMEPAGE_VAR_BESZEL_USERNAME: ${BESZEL_USERNAME}
      HOMEPAGE_VAR_BESZEL_PASSWORD: ${BESZEL_PASSWORD}
      HOMEPAGE_VAR_YOURSPOTIFY_KEY: ${YOURSPOTIFY_API_KEY}

      HOMEPAGE_VAR_PERSONAL_CALENDAR_URL: ${PERSONAL_CALENDAR_URL}
      HOMEPAGE_VAR_WORK_CALENDAR_URL: ${WORK_CALENDAR_URL}
      HOMEPAGE_VAR_BG_HOLIDAYS_CALENDAR_URL: ${BG_HOLIDAYS_CALENDAR_URL}
      HOMEPAGE_VAR_BIRTHDAYS_CALENDAR_URL: ${BIRTHDAYS_CALENDAR_URL}
      HOMEPAGE_VAR_MEDICAL_CALENDAR_URL: ${MEDICAL_CALENDAR_URL}

      HOMEPAGE_VAR_QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME}
      HOMEPAGE_VAR_QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      HOMEPAGE_VAR_DATA_PATH: ${DATA_PATH}
      HOMEPAGE_VAR_MOVIES_PATH: ${MOVIES_PATH}
      HOMEPAGE_VAR_TVSHOWS_PATH: ${TVSHOWS_PATH}

    volumes:
      - ./homepage/config:/app/config:Z
      - ./homepage/images:/app/public/images:ro,Z
      - /var/run/docker.sock:/var/run/docker.sock:ro

    expose:
      - "3000"

    networks:
      - edge

  quotes-service:
    build:
      context: ./quotes-service
    container_name: quotes-service
    restart: unless-stopped
    logging: *default-logging

    volumes:
      - ./quotes-service/quotes.json:/app/quotes.json:ro,Z

    networks:
      - edge
  
  ovumcy:
    image: ghcr.io/ovumcy/ovumcy-web:v1.9.2
    container_name: ovumcy
    restart: unless-stopped
    init: true
    logging: *default-logging

    environment:
      TZ: ${TZ}
      DEFAULT_LANGUAGE: en

      REGISTRATION_MODE: "closed"

      SECRET_KEY: ${OVUMCY_SECRET_KEY}

      PORT: "8080"

      DB_DRIVER: sqlite
      DB_PATH: /app/data/ovumcy.db

      CALENDAR_FEED_FENCE_PATH: /app/fence/calendar-feed.fence

      COOKIE_SECURE: "true"
      TRUST_PROXY_ENABLED: "true"
      PROXY_HEADER: X-Real-IP
      TRUSTED_PROXIES: ${OVUMCY_TRUSTED_PROXIES}

    volumes:
      - ./ovumcy/data:/app/data:Z
      - ./ovumcy/fence:/app/fence:Z

    expose:
      - "8080"

    networks:
      - edge

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp

    healthcheck:
      test: ["CMD", "/app/ovumcy", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  your-spotify:
    image: lscr.io/linuxserver/your_spotify:1.20.0-ls162
    container_name: your-spotify
    restart: unless-stopped
    logging: *default-logging

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

      - APP_URL=https://spotify.${BASE_DOMAIN}
      - SPOTIFY_PUBLIC=${YOUR_SPOTIFY_CLIENT_ID}
      - SPOTIFY_SECRET=${YOUR_SPOTIFY_CLIENT_SECRET}

      - SPOTIFY_API_DELAY_MS=2000
      - CORS=https://spotify.${BASE_DOMAIN}

      - MONGO_ENDPOINT=mongodb://your-spotify-mongo:27017/your_spotify

    expose:
      - "80"

    depends_on:
      your-spotify-mongo:
        condition: service_healthy

    networks:
      - edge
      - spotify

  your-spotify-mongo:
    image: mongo:8.0.32
    container_name: your-spotify-mongo
    restart: unless-stopped
    logging: *default-logging

    volumes:
      - ./your-spotify/data:/data/db:Z

    networks:
      - spotify

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  zimi:
    image: epheterson/zimi:1.13.0
    container_name: zimi
    restart: unless-stopped
    init: true
    logging: *default-logging

    environment:
      ZIM_DIR: /zims
      ZIMI_DATA_DIR: /config

      ZIMI_MANAGE: "1"
      ZIMI_MANAGE_USER: ${ZIMI_MANAGE_USER}
      ZIMI_MANAGE_PASSWORD: ${ZIMI_MANAGE_PASSWORD}

      ZIMI_PUBLIC_ACCESS: private

      ZIMI_CREATE_ROOT: /zims/sources

    volumes:
      - ${ZIMS_PATH}:/zims:Z
      - ./zimi/config:/config:Z

    expose:
      - "8899"

    networks:
      - edge

    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
