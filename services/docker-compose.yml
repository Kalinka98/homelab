x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  edge:
    external: true
    name: homelab-edge

services:
  actual:
    image: actualbudget/actual-server:latest
    container_name: actual-budget
    restart: unless-stopped
    logging: *default-logging

    volumes:
      - ./actual/data:/data:Z

    expose:
      - "5006"

    networks:
      - edge

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped

    environment:
      DOMAIN: "https://vault.${BASE_DOMAIN}"
      SIGNUPS_ALLOWED: "false"

    volumes:
      - ./vaultwarden/data:/data:Z

    networks:
      - edge

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.3.0
    container_name: homepage
    restart: unless-stopped
    logging: *default-logging

    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.${BASE_DOMAIN}

      HOMEPAGE_AUTH_ENABLED: "true"
      HOMEPAGE_AUTH_SECRET: ${HOMEPAGE_AUTH_SECRET}
      HOMEPAGE_AUTH_PASSWORD: ${HOMEPAGE_AUTH_PASSWORD}
      HOMEPAGE_EXTERNAL_URL: https://home.${BASE_DOMAIN}

      HOMEPAGE_VAR_ADGUARD_USERNAME: ${ADGUARD_USERNAME}
      HOMEPAGE_VAR_ADGUARD_PASSWORD: ${ADGUARD_PASSWORD}

      HOMEPAGE_VAR_SONARR_KEY: ${SONARR_API_KEY}
      HOMEPAGE_VAR_RADARR_KEY: ${RADARR_API_KEY}
      HOMEPAGE_VAR_PROWLARR_KEY: ${PROWLARR_API_KEY}
      HOMEPAGE_VAR_BAZARR_KEY: ${BAZARR_API_KEY}
      HOMEPAGE_VAR_JELLYFIN_KEY: ${JELLYFIN_API_KEY}
      HOMEPAGE_VAR_SPEEDTEST_APP_KEY: ${SPEEDTEST_API_KEY}

      HOMEPAGE_VAR_PERSONAL_CALENDAR_URL: ${PERSONAL_CALENDAR_URL}
      HOMEPAGE_VAR_WORK_CALENDAR_URL: ${WORK_CALENDAR_URL}
      HOMEPAGE_VAR_BG_HOLIDAYS_CALENDAR_URL: ${BG_HOLIDAYS_CALENDAR_URL}
      HOMEPAGE_VAR_BIRTHDAYS_CALENDAR_URL: ${BIRTHDAYS_CALENDAR_URL}
      HOMEPAGE_VAR_MEDICAL_CALENDAR_URL: ${MEDICAL_CALENDAR_URL}

      HOMEPAGE_VAR_QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME}
      HOMEPAGE_VAR_QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}

    volumes:
      - ./homepage/config:/app/config:Z
      - ./homepage/images:/app/public/images:ro,Z
      - /var/run/docker.sock:/var/run/docker.sock:ro

    expose:
      - "3000"

    networks:
      - edge

  quotes-service:
    build:
      context: ./quotes-service

    container_name: quotes-service

    restart: unless-stopped

    volumes:
      - ./quotes-service/quotes.json:/app/quotes.json:ro,Z

    networks:
      - edge
