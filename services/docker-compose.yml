x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  edge:
    external: true
    name: homelab-edge
  
  ai:
    external: true
    name: homelab-ai

  dvinyl_db:
    driver: bridge
    internal: true


services:
  actual:
    image: actualbudget/actual-server:26.10.0
    container_name: actual-budget
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    volumes:
      - ./actual/data:/data:Z

    expose:
      - "5006"

    networks:
      - edge

  vaultwarden:
    image: vaultwarden/server:1.37.3
    container_name: vaultwarden
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      DOMAIN: "https://vault.${BASE_DOMAIN:?Set BASE_DOMAIN in .env}"
      SIGNUPS_ALLOWED: "false"

    volumes:
      - ./vaultwarden/data:/data:Z

    networks:
      - edge

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0
    container_name: homepage
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.${BASE_DOMAIN:?Required}

      HOMEPAGE_AUTH_ENABLED: "true"
      HOMEPAGE_AUTH_SECRET: ${HOMEPAGE_AUTH_SECRET:?Required}
      HOMEPAGE_AUTH_PASSWORD: ${HOMEPAGE_AUTH_PASSWORD:?Required}
      HOMEPAGE_EXTERNAL_URL: https://home.${BASE_DOMAIN:?Required}
      HOMEPAGE_VAR_BASE_DOMAIN: ${BASE_DOMAIN:?Required}

      HOMEPAGE_VAR_ADGUARD_USERNAME: ${ADGUARD_USERNAME}
      HOMEPAGE_VAR_ADGUARD_PASSWORD: ${ADGUARD_PASSWORD}

      HOMEPAGE_VAR_JELLYFIN_KEY: ${JELLYFIN_API_KEY}
      HOMEPAGE_VAR_SPEEDTEST_API_KEY: ${SPEEDTEST_API_KEY}
      HOMEPAGE_VAR_IMMICH_KEY: ${IMMICH_API_KEY}

      HOMEPAGE_VAR_PERSONAL_CALENDAR_URL: ${PERSONAL_CALENDAR_URL}
      HOMEPAGE_VAR_WORK_CALENDAR_URL: ${WORK_CALENDAR_URL}
      HOMEPAGE_VAR_BG_HOLIDAYS_CALENDAR_URL: ${BG_HOLIDAYS_CALENDAR_URL}
      HOMEPAGE_VAR_BIRTHDAYS_CALENDAR_URL: ${BIRTHDAYS_CALENDAR_URL}
      HOMEPAGE_VAR_MEDICAL_CALENDAR_URL: ${MEDICAL_CALENDAR_URL}

      HOMEPAGE_VAR_QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME}
      HOMEPAGE_VAR_QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      HOMEPAGE_VAR_DATA_PATH: ${DATA_PATH}
      HOMEPAGE_VAR_MOVIES_PATH: ${MOVIES_PATH}
      HOMEPAGE_VAR_TVSHOWS_PATH: ${TVSHOWS_PATH}

    volumes:
      - ./homepage/config:/app/config:Z
      - ./homepage/images:/app/public/images:ro,Z

    expose:
      - "3000"

    networks:
      - edge

  quotes-service:
    build:
      context: ./quotes-service
    container_name: quotes-service
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    volumes:
      - ./quotes-service/quotes.json:/app/quotes.json:ro,Z

    networks:
      - edge
  
  ovumcy:
    image: ghcr.io/ovumcy/ovumcy-web:v1.9.2
    container_name: ovumcy
    restart: unless-stopped
    init: true
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      TZ: ${TZ}
      DEFAULT_LANGUAGE: en

      REGISTRATION_MODE: "closed"

      SECRET_KEY: ${OVUMCY_SECRET_KEY:?Set OVUMCY_SECRET_KEY in .env}

      PORT: "8080"

      DB_DRIVER: sqlite
      DB_PATH: /app/data/ovumcy.db

      CALENDAR_FEED_FENCE_PATH: /app/fence/calendar-feed.fence

      COOKIE_SECURE: "true"
      TRUST_PROXY_ENABLED: "true"
      PROXY_HEADER: X-Real-IP
      TRUSTED_PROXIES: ${OVUMCY_TRUSTED_PROXIES:?Set OVUMCY_TRUSTED_PROXIES in .env}

    volumes:
      - ./ovumcy/data:/app/data:Z
      - ./ovumcy/fence:/app/fence:Z

    expose:
      - "8080"

    networks:
      - edge

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp

    healthcheck:
      test: ["CMD", "/app/ovumcy", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  zimi:
    image: epheterson/zimi:1.13.0
    container_name: zimi
    restart: unless-stopped
    init: true
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      ZIM_DIR: /zims
      ZIMI_DATA_DIR: /config

      ZIMI_MANAGE: "1"
      ZIMI_MANAGE_USER: ${ZIMI_MANAGE_USER:?Set ZIMI_MANAGE_USER in .env}
      ZIMI_MANAGE_PASSWORD: ${ZIMI_MANAGE_PASSWORD:?Set ZIMI_MANAGE_PASSWORD in .env}

      ZIMI_PUBLIC_ACCESS: private

      ZIMI_CREATE_ROOT: /zims/sources

    volumes:
      - ${ZIMS_PATH:?Set ZIMS_PATH in .env}:/zims:Z
      - ./zimi/config:/config:Z

    expose:
      - "8899"

    networks:
      - edge

    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.28.0
    container_name: mealie
    restart: unless-stopped
    init: true
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      PUID: ${PUID:?Set PUID in .env}
      PGID: ${PGID:?Set PGID in .env}
      TZ: ${TZ}

      BASE_URL: https://mealie.${BASE_DOMAIN:?Set BASE_DOMAIN in .env}
      ALLOW_SIGNUP: "false"

      DB_ENGINE: sqlite
      DEFAULT_GROUP: Home
      DEFAULT_HOUSEHOLD: Family

    volumes:
      - ./mealie/data:/app/data:Z

    expose:
      - "9000"

    networks:
      - edge
      - ai

    mem_limit: 1g

  dvinyl-mongo:
    image: mongo:8.0.32-noble
    container_name: dvinyl-mongo
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      MONGO_INITDB_ROOT_USERNAME: dvinyl
      MONGO_INITDB_ROOT_PASSWORD: ${DVINYL_DB_PASSWORD:?Set DVINYL_DB_PASSWORD in .env}

    command:
      - --wiredTigerCacheSizeGB
      - "0.25"

    volumes:
      - ./dvinyl/data/mongo:/data/db:Z

    networks:
      - dvinyl_db

    mem_limit: 1g

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval 'db.adminCommand({ ping: 1 }).ok'
          | grep -qx 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  dvinyl:
    image: ghcr.io/kyonew/dvinyl:3.2.1
    container_name: dvinyl
    restart: unless-stopped
    init: true
    logging: *default-logging
    labels:
      kuma.__container: "true"

    depends_on:
      dvinyl-mongo:
        condition: service_healthy

    environment:
      TZ: ${TZ}

      VINYL_PORT: "3099"
      PROD: "true"
      BASE_URL: ""

      MONGODB_URL: "mongodb://dvinyl:${DVINYL_DB_PASSWORD:?Set DVINYL_DB_PASSWORD in .env}@dvinyl-mongo:27017/dvinyl?authSource=admin"

      PASSJWT: ${DVINYL_PASSJWT:?Set DVINYL_PASSJWT in .env}
      SESSION_SECRET: ${DVINYL_SESSION_SECRET:?Set DVINYL_SESSION_SECRET in .env}

      DISCOGS_TOKEN: ${DVINYL_DISCOGS_TOKEN:?Set DVINYL_DISCOGS_TOKEN in .env}

    volumes:
      - ./dvinyl/data/uploads:/app/public/uploads:Z

    expose:
      - "3099"

    networks:
      - edge
      - dvinyl_db
