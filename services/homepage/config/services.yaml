- Daily:
    - Daily Inspiration:
        icon: mdi-format-quote-open
        widget:
          type: iframe
          name: daily-inspiration
          src: https://home.kalinka.dev/quotes/
          classes: h-28
          allowScrolling: no
    - Calendar:
        widget:
          type: calendar
          view: agenda
          showTime: true
          maxEvents: 5
          integrations:
            - type: ical
              url: "{{HOMEPAGE_VAR_PERSONAL_CALENDAR_URL}}"
              name: My Events
              color: indigo
            - type: ical
              url: "{{HOMEPAGE_VAR_WORK_CALENDAR_URL}}"
              name: Work Events
              color: violet
            - type: ical
              url: "{{HOMEPAGE_VAR_BG_HOLIDAYS_CALENDAR_URL}}"
              name: Bulgaria Holidays
              color: emerald
            - type: ical
              url: "{{HOMEPAGE_VAR_BIRTHDAYS_CALENDAR_URL}}"
              name: Birthdays
              color: amber
            - type: ical
              url: "{{HOMEPAGE_VAR_MEDICAL_CALENDAR_URL}}"
              name: Medical
              color: green

- Media:
    - Jellyfin:
        id: jellyfin
        icon: mdi-play-circle-outline
        href: https://jellyfin.kalinka.dev
        description: Who needs Netflix anyway?
        siteMonitor: https://jellyfin.kalinka.dev/health
        widget:
          type: jellyfin
          url: https://jellyfin.kalinka.dev
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2
          enableBlocks: true
          enableNowPlaying: false
          enableUser: false
          enableMediaControl: false
          expandOneStreamToTwoRows: false
          showEpisodeNumber: false
          fields: [movies, series, episodes]

- Media Automation:
    - Sonarr:
        id: sonarr
        icon: mdi-television-classic
        href: https://sonarr.kalinka.dev
        description: Сериалчетата
        server: local
        container: sonarr

    - Radarr:
        id: radarr
        icon: mdi-filmstrip
        href: https://radarr.kalinka.dev
        description: Филмчита
        server: local
        container: radarr

    - qBittorrent:
        id: qbittorrent
        icon: mdi-download-network-outline
        href: https://qbittorrent.kalinka.dev
        description: Torrenting (not pirating)
        server: local
        container: qbittorrent

    - Prowlarr:
        id: prowlarr
        icon: mdi-magnify
