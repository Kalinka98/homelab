
- Header:
    - Daily:
        - Daily Inspiration:
            icon: mdi-format-quote-open
            widget:
              type: iframe
              name: daily-inspiration
              src: https://home.kalinka.dev/quotes/
              classes: h-45
              allowScrolling: no

        - Agenda:
            icon: mdi-calendar
            widget:
              type: calendar
              view: agenda
              showTime: true
              maxEvents: 7
              integrations:
                - type: ical
                  url: "{{HOMEPAGE_VAR_PERSONAL_CALENDAR_URL}}"
                  name: My Events
                  color: indigo
                - type: ical
                  url: "{{HOMEPAGE_VAR_WORK_CALENDAR_URL}}"
                  name: Work Events
                  color: violet
                - type: ical
                  url: "{{HOMEPAGE_VAR_BG_HOLIDAYS_CALENDAR_URL}}"
                  name: Bulgaria Holidays
                  color: emerald
                - type: ical
                  url: "{{HOMEPAGE_VAR_BIRTHDAYS_CALENDAR_URL}}"
                  name: Birthdays
                  color: amber
                - type: ical
                  url: "{{HOMEPAGE_VAR_MEDICAL_CALENDAR_URL}}"
                  name: Medical
                  color: green

        - Jellyfin:
            id: jellyfin
            icon: mdi-play-circle-outline
            href: https://jellyfin.kalinka.dev
            description: Who needs Netflix anyway?
            widget:
              type: jellyfin
              url: https://jellyfin.kalinka.dev
              key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
              version: 2
              enableBlocks: true
              enableNowPlaying: true
              enableUser: true
              enableMediaControl: false
              expandOneStreamToTwoRows: false
              showEpisodeNumber: true
              fields: [movies, series, episodes]
              
        - Services Status:
            href: https://status.kalinka.dev
            icon: mdi-check
            widget:
              type: uptimekuma
              url: http://uptime-kuma:3001
              slug: homelab
              fields: [up, down]
    - Monitoring:
        - CPU:
            widget:
              type: glances
              url: http://glances:61208
              version: 4
              metric: cpu
              chart: true

        - CPU Temperature:
            widget:
              type: glances
              url: http://glances:61208
              version: 4
              metric: sensor:Tctl
              chart: true

        - Memory:
            widget:
              type: glances
              url: http://glances:61208
              version: 4
              metric: memory
              chart: true

        - GPU:
            widget:
              type: glances
              url: http://glances:61208
              version: 4
              metric: gpu:nvidia0
              chart: true
- Footer: 
    -  Section:
        - qBittorrent:
            id: qbittorrent
            icon: mdi-download-network-outline
            href: https://qbittorrent.kalinka.dev
            description: Torrenting (not pirating)
            widget:
              type: qbittorrent
              url: https://qbittorrent.kalinka.dev
              username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
              password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
              enableLeechProgress: true
              enableLeechSize: true
    - Section2:
        - AdGuard Home:
            id: adguard
            icon: mdi-shield-check-outline
            href: https://adguard.kalinka.dev
            description: Say not to ads!
            widget:
              type: adguard
              url: http://adguard:3000
              username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
              password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
              fields: [queries, blocked, latency]
        - Immich:
            id: immich
            icon: immich.svg
            href: https://immich.kalinka.dev
            description: Photos & videos
            widget:
              type: immich
              url: http://immich-server:2283
              key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
              version: 2
              fields: [photos, videos]
    - Section3:    
        - Your Spotify:
            id: yourspotify
            icon: mdi-spotify
            href: https://spotify.kalinka.dev
            description: Listening statistics
            widget:
              type: yourspotify
              url: http://your-spotify/api
              key: "{{HOMEPAGE_VAR_YOURSPOTIFY_KEY}}"
              interval: year
              fields: [songs, artists, time]

        - Network Speed:
            icon: mdi-speedometer
            href: https://speedtest.kalinka.dev
            widget:
              type: speedtest
              url: https://speedtest.kalinka.dev
              version: 2
              key: "{{HOMEPAGE_VAR_SPEEDTEST_APP_KEY}}"
        