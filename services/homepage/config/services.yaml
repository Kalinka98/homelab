- Infrastructure:
    - AdGuard Home:
        id: adguard
        icon: mdi-shield-check-outline
        href: https://adguard.kalinka.dev
        description: Say not to ads!
        server: local
        container: adguard
        widget:
          type: adguard
          url: http://adguard:3000
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
          fields: [queries, blocked, latency]

    - Uptime Kuma:
        id: uptime-kuma
        icon: mdi-heart-pulse
        href: https://status.kalinka.dev
        description: Service Status
        server: local
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: homelab
          fields: [up, down]

    - Speedtest Tracker:
        id: speedtest-tracker
        icon: mdi-speedometer
        href: https://speedtest.kalinka.dev
        server: local
        container: speedtest-tracker
        widget:
          type: speedtest
          url: https://speedtest.kalinka.dev
          version: 2
          key: "{{HOMEPAGE_VAR_SPEEDTEST_APP_KEY}}"

    - Caddy:
        id: caddy
        icon: mdi-lock-outline
        description: Reverse Proxy
        server: local
        container: caddy

    - Dozzle:
        id: dozzle
        icon: mdi-console-line
        href: https://logs.kalinka.dev
        description: Docker Logs
        server: local
        container: dozzle

    - ntfy:
        id: ntfy
        icon: mdi-bell-outline
        href: https://notify.kalinka.dev
        description: Notification Services
        server: local
        container: ntfy

    - Vaultwarden:
        id: vaultwarden
        icon: mdi-shield-key-outline
        href: https://vault.kalinka.dev
        server: local
        container: vaultwarden

- Personal:
    - Ovumcy:
        icon: mdi-calendar-heart
        href: https://cycle.kalinka.dev
        description: Cycle tracking
        container: ovumcy
        server: local
    - Free Games Claimer:
        icon: mdi-steam
        href: http://localhost:7080
        description: Automatically claims free Steam games
        container: fgc-remaster
        server: local
