
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  edge:
    external: true
    name: homelab-edge

  paperless:
    driver: bridge
    internal: true
  
  ai:
    external: true
    name: homelab-ai

services:
  paperless-db:
    image: postgres:18-alpine
    container_name: paperless-db
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:?Required}

    volumes:
      - ./data/postgres:/var/lib/postgresql:Z

    shm_size: 128mb

    networks:
      - paperless

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  paperless-valkey:
    image: valkey/valkey:9-alpine
    container_name: paperless-valkey
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    volumes:
      - ./data/valkey:/data:Z

    networks:
      - paperless

    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.0
    container_name: paperless
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-valkey:
        condition: service_healthy
      paperless-gotenberg:
        condition: service_started
      paperless-tika:
        condition: service_started

    environment:
      TZ: ${TZ}

      PAPERLESS_URL: https://paperless.${BASE_DOMAIN}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?Required}
      PAPERLESS_TIME_ZONE: ${TZ}

      USERMAP_UID: ${PUID}
      USERMAP_GID: ${PGID}

      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:?Required}

      PAPERLESS_REDIS: redis://paperless-valkey:6379

      PAPERLESS_OCR_LANGUAGES: "bul"
      PAPERLESS_OCR_LANGUAGE: "bul+eng"
      PAPERLESS_OCR_MODE: auto

      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_THREADS_PER_WORKER: "2"

      PAPERLESS_TIKA_ENABLED: "true"
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000

      PAPERLESS_AI_ENABLED: "true"
      PAPERLESS_AI_LLM_BACKEND: ollama
      PAPERLESS_AI_LLM_ENDPOINT: http://ollama:11434
      PAPERLESS_AI_LLM_MODEL: qwen3-vl:8b-instruct

      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ollama
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: embeddinggemma

      PAPERLESS_AI_LLM_CONTEXT_SIZE: "8192"
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "240"
      PAPERLESS_AI_LLM_EMBEDDING_CHUNK_SIZE: "1024"

    volumes:
      - ./data/app:/usr/src/paperless/data:Z
      - ${DATA_PATH:?Required}/paperless/media:/usr/src/paperless/media:Z
      - ./data/consume:/usr/src/paperless/consume:Z
      - ./data/export:/usr/src/paperless/export:Z

    expose:
      - "8000"

    networks:
      - edge
      - paperless
      - ai


  paperless-gotenberg:
    image: gotenberg/gotenberg:8.37.0
    container_name: paperless-gotenberg
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

    expose:
      - "3000"

    networks:
      - paperless

  paperless-tika:
    image: apache/tika:3.3.1.0
    container_name: paperless-tika
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    expose:
      - "9998"

    networks:
      - paperless

