x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  edge:
    external: true
    name: homelab-edge

  media:
    driver: bridge

services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    container_name: jellyfin
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    user: "${PUID:?Set PUID in .env}:${PGID:?Set PGID in .env}"

    runtime: nvidia

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    environment:
      - TZ=${TZ}

    volumes:
      - ./jellyfin/config:/config:Z
      - ./jellyfin/cache:/cache:Z

      # Lowercase z shares SELinux labels with the other media containers.
      - ${MOVIES_PATH:?Set MOVIES_PATH in .env}:/movies:z
      - ${TVSHOWS_PATH:?Set TVSHOWS_PATH in .env}:/tvshows:z

    expose:
      - "8096"

    networks:
      - edge
      - media

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls318
    container_name: radarr
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      - PUID=${PUID:?Set PUID in .env}
      - PGID=${PGID:?Set PGID in .env}
      - TZ=${TZ}

    volumes:
      - ./radarr/config:/config:Z
      - ${MOVIES_PATH:?Set MOVIES_PATH in .env}:/movies:z
      - ${TVSHOWS_PATH:?Set TVSHOWS_PATH in .env}:/tvshows:z
      - ${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads:z

    expose:
      - "7878"

    networks:
      - edge
      - media

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls326
    container_name: sonarr
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      - PUID=${PUID:?Set PUID in .env}
      - PGID=${PGID:?Set PGID in .env}
      - TZ=${TZ}

    volumes:
      - ./sonarr/config:/config:Z
      - ${MOVIES_PATH:?Set MOVIES_PATH in .env}:/movies:z
      - ${TVSHOWS_PATH:?Set TVSHOWS_PATH in .env}:/tvshows:z
      - ${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads:z

    expose:
      - "8989"

    networks:
      - edge
      - media

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls479
    container_name: qbittorrent
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      - PUID=${PUID:?Set PUID in .env}
      - PGID=${PGID:?Set PGID in .env}
      - TZ=${TZ}
      - WEBUI_PORT=8080

    volumes:
      - ./qbittorrent/config:/config:Z
      - ${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}:/downloads:z

    expose:
      - "8080"

    networks:
      - edge
      - media

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls162
    container_name: prowlarr
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      - PUID=${PUID:?Set PUID in .env}
      - PGID=${PGID:?Set PGID in .env}
      - TZ=${TZ}

    volumes:
      - ./prowlarr/config:/config:Z

    expose:
      - "9696"

    networks:
      - edge
      - media

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}

    expose:
      - "8191"

    networks:
      - media

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls366
    container_name: bazarr
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      - PUID=${PUID:?Set PUID in .env}
      - PGID=${PGID:?Set PGID in .env}
      - TZ=${TZ}

    volumes:
      - ./bazarr/config:/config:Z
      - ${MOVIES_PATH:?Set MOVIES_PATH in .env}:/movies:z
      - ${TVSHOWS_PATH:?Set TVSHOWS_PATH in .env}:/tvshows:z

    expose:
      - "6767"

    networks:
      - edge
      - media

  simplesubgen:
    image: kalinkadev/simplesubgen:v1.0.1
    container_name: simplesubgen
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    environment:
      HF_HOME: /models
      NVIDIA_VISIBLE_DEVICES: all
      HF_TOKEN: ${HF_TOKEN:-}
      MEDIA_PATHS: /movies,/tvshows
      SCANNER_INTERVAL: ${SCANNER_INTERVAL}
      WHISPER_MODEL: ${WHISPER_MODEL}
      WHISPER_DEVICE: ${WHISPER_DEVICE}
      NLLB_MODEL: ${NLLB_MODEL}
      TARGET_LANGUAGES: ${TARGET_LANGUAGES}
      PREFERRED_AUDIO_LANGUAGE: ${PREFERRED_AUDIO_LANGUAGE}
      WORKERS: ${WORKERS}
      DATABASE_PATH: ${DATABASE_PATH:?Set DATABASE_PATH in .env}
      SUBTITLE_FORMAT: ${SUBTITLE_FORMAT}
      SUBTITLE_SUFFIX: ${SUBTITLE_SUFFIX}

    volumes:
      - ./simplesubgen/data:/data:Z
      - ./simplesubgen/models:/models:Z
      - ${MOVIES_PATH:?Set MOVIES_PATH in .env}:/movies:z
      - ${TVSHOWS_PATH:?Set TVSHOWS_PATH in .env}:/tvshows:z

    networks:
      - media
