x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  edge:
    external: true
    name: homelab-edge

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    logging: *default-logging

    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./caddy/sites:/etc/caddy/sites:ro,Z
      - ./caddy/data:/data:Z
      - ./caddy/config:/config:Z

    networks:
      - edge

  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    logging: *default-logging

    ports:
      - "${SERVER_IP_ADDRESS}:53:53/tcp"
      - "${SERVER_IP_ADDRESS}:53:53/udp"

      - "${SERVER_IP_ADDRESS}:3000:3000/tcp"

    volumes:
      - ./adguard/work:/opt/adguardhome/work:Z
      - ./adguard/conf:/opt/adguardhome/conf:Z

    networks:
      - edge

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    logging: *default-logging

    volumes:
      - ./uptime-kuma/data:/app/data:Z

    expose:
      - "3001"

    networks:
      - edge

  dozzle:
    image: amir20/dozzle:v10.7.5
    container_name: dozzle
    restart: unless-stopped
    logging: *default-logging

    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 48h

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle/data:/data:Z

    expose:
      - "8080"

    networks:
      - edge

  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    logging: *default-logging

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

      APP_TIMEZONE: ${TZ}
      DISPLAY_TIMEZONE: ${TZ}

      APP_KEY: ${SPEEDTEST_APP_KEY}
      APP_URL: https://speedtest.${BASE_DOMAIN}
      ASSET_URL: https://speedtest.${BASE_DOMAIN}

      DB_CONNECTION: sqlite

      ADMIN_EMAIL: ${SPEEDTEST_TRACKER_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${SPEEDTEST_TRACKER_ADMIN_PASSWORD}

      SPEEDTEST_SCHEDULE: "17 */1 * * *"
      PRUNE_RESULTS_OLDER_THAN: 0

      PUBLIC_DASHBOARD: "false"

    volumes:
      - ./speedtest-tracker/config:/config:Z

    networks:
      - edge

  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ntfy
    restart: unless-stopped
    init: true
    logging: *default-logging

    command:
      - serve

    environment:
      TZ: ${TZ}

      NTFY_BASE_URL: https://notify.${BASE_DOMAIN}
      NTFY_BEHIND_PROXY: "true"

      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db

      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"

      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh

    volumes:
      - ./ntfy/data:/var/lib/ntfy:Z

    expose:
      - "80"

    networks:
      - edge

  homelable-backend:
    image: ghcr.io/pouzor/homelable-backend:latest
    container_name: homelable-backend
    restart: unless-stopped
    logging: *default-logging

    network_mode: host

    cap_add:
      - NET_RAW

    environment:
      SECRET_KEY: ${HOMELABLE_SECRET_KEY}

      SQLITE_PATH: /app/data/homelab.db

      CORS_ORIGINS: "[\"https://homelable.${BASE_DOMAIN}\"]"

      AUTH_MODE: local
      AUTH_USERNAME: ${HOMELABLE_AUTH_USERNAME}
      AUTH_PASSWORD_HASH: ${HOMELABLE_AUTH_PASSWORD_HASH}

      SCANNER_RANGES: "[\"192.168.0.0/24\"]"

      STATUS_CHECKER_INTERVAL: "60"

      HOMEPAGE_API_KEY: ${HOMELABLE_HOMEPAGE_API_KEY}

    volumes:
      - ./homelable/data:/app/data:Z


  homelable:
    image: ghcr.io/pouzor/homelable-frontend:latest
    container_name: homelable
    restart: unless-stopped
    logging: *default-logging

    environment:
      BACKEND_UPSTREAM: "host.docker.internal:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - homelable-backend

    expose:
      - "80"

    networks:
      - edge
