x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  edge:
    external: true
    name: homelab-edge
  
  docker_monitor:
    name: homelab-docker-monitor
    driver: bridge
    internal: true

services:
  caddy:
    # Wait for the 2.11.7 image; 2.11.6 has known proxy regressions.
    image: caddy:2.11.4-alpine
    container_name: caddy
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./caddy/sites:/etc/caddy/sites:ro,Z
      - ./caddy/data:/data:Z
      - ./caddy/config:/config:Z

    networks:
      - edge

  adguard:
    image: adguard/adguardhome:v0.107.79
    container_name: adguard
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    ports:
      - "${SERVER_IP_ADDRESS}:53:53/tcp"
      - "${SERVER_IP_ADDRESS}:53:53/udp"

      - "${SERVER_IP_ADDRESS}:3000:3000/tcp"

    volumes:
      - ./adguard/work:/opt/adguardhome/work:Z
      - ./adguard/conf:/opt/adguardhome/conf:Z

    networks:
      - edge

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    container_name: uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    volumes:
      - ./uptime-kuma/data:/app/data:Z

    expose:
      - "3001"

    networks:
      - edge
      - docker_monitor

  kuma-docker-api:
    image: codeswhat/sockguard:2.2.6
    container_name: kuma-docker-api
    restart: unless-stopped
    command:
      - serve
      - --config
      - /etc/sockguard/config.yaml
    logging: *default-logging
    labels:
      kuma.__container: "true"

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    group_add:
      - "${DOCKER_SOCK_GID:?Set DOCKER_SOCK_GID in .env}"

    environment:
      SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP: "true"
      SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS: "true"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./kuma-docker-api/sockguard.yaml:/etc/sockguard/config.yaml:ro,Z

    networks:
      - docker_monitor
  
  autokuma:
    image: ghcr.io/bigboot/autokuma:2.0.0
    container_name: autokuma
    restart: unless-stopped
    logging: *default-logging

    depends_on:
      uptime-kuma:
        condition: service_healthy
      kuma-docker-api:
        condition: service_started

    environment:
      AUTOKUMA__KUMA__URL: http://uptime-kuma:3001
      AUTOKUMA__KUMA__USERNAME: ${AUTOKUMA_KUMA_USERNAME:?Required}
      AUTOKUMA__KUMA__PASSWORD: ${AUTOKUMA_KUMA_PASSWORD:?Required}

      AUTOKUMA__DOCKER__HOSTS: tcp://kuma-docker-api:2375

      AUTOKUMA__DOCKER__EXCLUDE_CONTAINER_PATTERNS: "^[a-f0-9]{12}_.*_"

      AUTOKUMA__ON_DELETE: keep

      AUTOKUMA__DEFAULT_SETTINGS: |-
        *.notification_id_list: {"1":true}

      AUTOKUMA__SNIPPETS__CONTAINER: |-
        {{ container_name }}.docker.name: {{ container_name }} · Container
        {{ container_name }}.docker.docker_container: {{ container_name }}
        {{ container_name }}.docker.docker_host_name: fedora
        {{ container_name }}.docker.interval: 60
        {{ container_name }}.docker.max_retries: 2

    volumes:
      - ./autokuma/data:/data:Z

    labels:
      kuma.fedora.docker_host.name: "Fedora Docker (AutoKuma)"
      kuma.fedora.docker_host.connection_type: "tcp"
      kuma.fedora.docker_host.host: "http://kuma-docker-api:2375"

      kuma.__container: "true"

    networks:
      - edge
      - docker_monitor

  dozzle:
    image: amir20/dozzle:v11.2.0
    container_name: dozzle
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 48h

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle/data:/data:Z

    expose:
      - "8080"

    networks:
      - edge

  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:v1.15.0-ls174
    container_name: speedtest-tracker
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

      APP_TIMEZONE: ${TZ}
      DISPLAY_TIMEZONE: ${TZ}

      APP_KEY: ${SPEEDTEST_APP_KEY}
      APP_URL: https://speedtest.${BASE_DOMAIN}
      ASSET_URL: https://speedtest.${BASE_DOMAIN}

      DB_CONNECTION: sqlite

      ADMIN_EMAIL: ${SPEEDTEST_TRACKER_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${SPEEDTEST_TRACKER_ADMIN_PASSWORD}

      SPEEDTEST_SCHEDULE: "17 */1 * * *"
      PRUNE_RESULTS_OLDER_THAN: 0

      PUBLIC_DASHBOARD: "false"

    volumes:
      - ./speedtest-tracker/config:/config:Z

    networks:
      - edge

  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ntfy
    restart: unless-stopped
    init: true
    logging: *default-logging
    labels:
      kuma.__container: "true"

    command:
      - serve

    environment:
      TZ: ${TZ}

      NTFY_BASE_URL: https://notify.${BASE_DOMAIN}
      NTFY_BEHIND_PROXY: "true"

      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db

      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"

      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh

    volumes:
      - ./ntfy/data:/var/lib/ntfy:Z

    expose:
      - "80"

    networks:
      - edge

  homelable-backend:
    image: ghcr.io/pouzor/homelable-backend:3.5.1
    container_name: homelable-backend
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    network_mode: host

    cap_add:
      - NET_RAW

    environment:
      SECRET_KEY: ${HOMELABLE_SECRET_KEY}

      SQLITE_PATH: /app/data/homelab.db

      CORS_ORIGINS: "[\"https://homelable.${BASE_DOMAIN}\"]"

      AUTH_MODE: local
      AUTH_USERNAME: ${HOMELABLE_AUTH_USERNAME}
      AUTH_PASSWORD_HASH: ${HOMELABLE_AUTH_PASSWORD_HASH}

      SCANNER_RANGES: "[\"192.168.0.0/24\"]"

      STATUS_CHECKER_INTERVAL: "60"

      HOMEPAGE_API_KEY: ${HOMELABLE_HOMEPAGE_API_KEY}

    volumes:
      - ./homelable/data:/app/data:Z


  homelable:
    image: ghcr.io/pouzor/homelable-frontend:3.5.1
    container_name: homelable
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      BACKEND_UPSTREAM: "host.docker.internal:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - homelable-backend

    expose:
      - "80"

    networks:
      - edge

  beszel:
    image: henrygd/beszel:0.21.0
    container_name: beszel
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      APP_URL: https://monitor.${BASE_DOMAIN}

    volumes:
      - ./beszel/data:/beszel_data:Z

    expose:
      - "8090"

    networks:
      - edge

    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      timeout: 5s
      start_period: 10s

  glances:
    image: nicolargo/glances:ubuntu-4.5.7-full
    container_name: glances
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    pid: host

    environment:
      GLANCES_OPT: "-w"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
      - /:/rootfs:ro
      - ${MOVIES_PATH}:${MOVIES_PATH}:ro
      - ${TVSHOWS_PATH}:${TVSHOWS_PATH}:ro
      - ${DATA_PATH}:${DATA_PATH}:ro

    ports:
      - "127.0.0.1:61208:61208"

    networks:
      - edge

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
