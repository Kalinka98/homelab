x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  edge:
    external: true
    name: homelab-edge
  
  docker_monitor:
    name: homelab-docker-monitor
    driver: bridge
    internal: true
  
  docker_logs:
    name: homelab-docker-logs
    driver: bridge
    internal: true

  ai:
    external: true
    name: homelab-ai


services:
  caddy:
    # Wait for the 2.11.7 image; 2.11.6 has known proxy regressions.
    image: caddy:2.11.4-alpine
    container_name: caddy
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?Set BASE_DOMAIN in .env}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./caddy/sites:/etc/caddy/sites:ro,Z
      - ./caddy/data:/data:Z
      - ./caddy/config:/config:Z

    networks:
      - edge

  adguard:
    image: adguard/adguardhome:v0.107.79
    container_name: adguard
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    ports:
      - "${SERVER_IP_ADDRESS:?Set SERVER_IP_ADDRESS in .env}:53:53/tcp"
      - "${SERVER_IP_ADDRESS:?Set SERVER_IP_ADDRESS in .env}:53:53/udp"

      - "${SERVER_IP_ADDRESS:?Set SERVER_IP_ADDRESS in .env}:3000:3000/tcp"

    volumes:
      - ./adguard/work:/opt/adguardhome/work:Z
      - ./adguard/conf:/opt/adguardhome/conf:Z

    networks:
      - edge

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    container_name: uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    volumes:
      - ./uptime-kuma/data:/app/data:Z

    expose:
      - "3001"

    networks:
      - edge
      - docker_monitor

  kuma-docker-api:
    image: codeswhat/sockguard:2.2.6
    container_name: kuma-docker-api
    restart: unless-stopped
    command:
      - serve
      - --config
      - /etc/sockguard/config.yaml
    logging: *default-logging
    labels:
      kuma.__container: "true"

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    group_add:
      - "${DOCKER_SOCK_GID:?Set DOCKER_SOCK_GID in .env}"

    environment:
      SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP: "true"
      SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS: "true"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./kuma-docker-api/sockguard.yaml:/etc/sockguard/config.yaml:ro,Z

    networks:
      - docker_monitor
  
  autokuma:
    image: ghcr.io/bigboot/autokuma:2.0.0
    container_name: autokuma
    restart: unless-stopped
    logging: *default-logging

    depends_on:
      uptime-kuma:
        condition: service_healthy
      kuma-docker-api:
        condition: service_started

    environment:
      AUTOKUMA__KUMA__URL: http://uptime-kuma:3001
      AUTOKUMA__KUMA__USERNAME: ${AUTOKUMA_KUMA_USERNAME:?Set AUTOKUMA_KUMA_USERNAME in .env}
      AUTOKUMA__KUMA__PASSWORD: ${AUTOKUMA_KUMA_PASSWORD:?Set AUTOKUMA_KUMA_PASSWORD in .env}

      AUTOKUMA__DOCKER__HOSTS: tcp://kuma-docker-api:2375

      AUTOKUMA__DOCKER__EXCLUDE_CONTAINER_PATTERNS: "^[a-f0-9]{12}_.*_"

      AUTOKUMA__ON_DELETE: keep

      AUTOKUMA__DEFAULT_SETTINGS: |-
        *.notification_id_list: {"1":true}

      AUTOKUMA__SNIPPETS__CONTAINER: |-
        {{ container_name }}.docker.name: {{ container_name }} · Container
        {{ container_name }}.docker.docker_container: {{ container_name }}
        {{ container_name }}.docker.docker_host_name: fedora
        {{ container_name }}.docker.interval: 60
        {{ container_name }}.docker.max_retries: 2

    volumes:
      - ./autokuma/data:/data:Z

    labels:
      kuma.fedora.docker_host.name: "Fedora Docker (AutoKuma)"
      kuma.fedora.docker_host.connection_type: "tcp"
      kuma.fedora.docker_host.host: "http://kuma-docker-api:2375"

      kuma.__container: "true"

    networks:
      - edge
      - docker_monitor

  dozzle:
    image: amir20/dozzle:v11.2.0
    container_name: dozzle
    restart: unless-stopped
    logging: *default-logging

    labels:
      kuma.__container: "true"

    depends_on:
      - dozzle-docker-api

    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 48h

      DOZZLE_REMOTE_HOST: tcp://dozzle-docker-api:2375

      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_IMAGE_CHECK_MODE: "off"

    volumes:
      - ./dozzle/data:/data:Z

    expose:
      - "8080"

    networks:
      - edge
      - docker_logs
  
  dozzle-docker-api:
    image: codeswhat/sockguard:2.2.6
    container_name: dozzle-docker-api
    restart: unless-stopped
    logging: *default-logging

    command:
      - serve
      - --config
      - /etc/sockguard/config.yaml

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    group_add:
      - "${DOCKER_SOCK_GID:?Set DOCKER_SOCK_GID in .env}"

    environment:
      SOCKGUARD_LISTEN_INSECURE_ALLOW_PLAIN_TCP: "true"
      SOCKGUARD_LISTEN_INSECURE_ALLOW_UNAUTHENTICATED_CLIENTS: "true"
      SOCKGUARD_INSECURE_ALLOW_READ_EXFILTRATION: "true"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle-docker-api/sockguard.yaml:/etc/sockguard/config.yaml:ro,Z

    networks:
      - docker_logs

  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:v1.15.0-ls174
    container_name: speedtest-tracker
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      PUID: ${PUID:?Set PUID in .env}
      PGID: ${PGID:?Set PGID in .env}
      TZ: ${TZ}

      APP_TIMEZONE: ${TZ}
      DISPLAY_TIMEZONE: ${TZ}

      APP_KEY: ${SPEEDTEST_APP_KEY:?Set SPEEDTEST_APP_KEY in .env}
      APP_URL: https://speedtest.${BASE_DOMAIN:?Set BASE_DOMAIN in .env}
      ASSET_URL: https://speedtest.${BASE_DOMAIN:?Set BASE_DOMAIN in .env}

      DB_CONNECTION: sqlite

      ADMIN_EMAIL: ${SPEEDTEST_TRACKER_ADMIN_EMAIL:?Set SPEEDTEST_TRACKER_ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${SPEEDTEST_TRACKER_ADMIN_PASSWORD:?Set SPEEDTEST_TRACKER_ADMIN_PASSWORD in .env}

      SPEEDTEST_SCHEDULE: "17 */1 * * *"
      PRUNE_RESULTS_OLDER_THAN: 0

      PUBLIC_DASHBOARD: "false"

    volumes:
      - ./speedtest-tracker/config:/config:Z

    networks:
      - edge

  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ntfy
    restart: unless-stopped
    init: true
    logging: *default-logging
    labels:
      kuma.__container: "true"

    command:
      - serve

    environment:
      TZ: ${TZ}

      NTFY_BASE_URL: https://notify.${BASE_DOMAIN:?Set BASE_DOMAIN in .env}
      NTFY_BEHIND_PROXY: "true"

      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db

      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"

      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh

    volumes:
      - ./ntfy/data:/var/lib/ntfy:Z

    expose:
      - "80"

    networks:
      - edge

  beszel:
    image: henrygd/beszel:0.21.0
    container_name: beszel
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      APP_URL: https://monitor.${BASE_DOMAIN:?Set BASE_DOMAIN in .env}

    volumes:
      - ./beszel/data:/beszel_data:Z

    expose:
      - "8090"

    networks:
      - edge

    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      timeout: 5s
      start_period: 10s

  glances:
    image: nicolargo/glances:ubuntu-4.5.7-full
    container_name: glances
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    pid: host

    environment:
      GLANCES_OPT: "-w"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    volumes:
      - /etc/os-release:/etc/os-release:ro
      - ${MOVIES_PATH:?Set MOVIES_PATH in .env}:${MOVIES_PATH:?Set MOVIES_PATH in .env}:ro
      - ${TVSHOWS_PATH:?Set TVSHOWS_PATH in .env}:${TVSHOWS_PATH:?Set TVSHOWS_PATH in .env}:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:${DATA_PATH:?Set DATA_PATH in .env}:ro

    ports:
      - "127.0.0.1:61208:61208"

    networks:
      - edge

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


  ollama:
    image: ollama/ollama:0.40.2
    container_name: ollama
    restart: unless-stopped
    init: true
    logging: *default-logging

    labels:
      kuma.__container: "true"

    environment:
      TZ: ${TZ}

      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"

      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "3m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"

    volumes:
      - ./ollama/data:/root/.ollama:Z

    expose:
      - "11434"

    networks:
      - ai

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

