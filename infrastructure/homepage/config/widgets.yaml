- logo:
    icon: /images/kalinka_emblem_icon.png

- greeting:
    text: Kalinka Homelab
    text_size: 3xl

- openmeteo:
    units: metric
    cache: 10
    format:
      maximumFractionDigits: 0

- search:
    provider: google
    showSearchSuggestions: true
    target: _blank

- datetime:
    text_size: md
    locale: en-GB
    format:
      weekday: short
      month: short
      day: numeric
      hour: 2-digit
      minute: 2-digit
      hourCycle: h23
