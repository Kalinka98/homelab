- openmeteo:
    # Omit coordinates to use the browser's location (allow access over HTTPS).
    units: metric
    cache: 10
    format:
      maximumFractionDigits: 0

- search:
    provider: google
    showSearchSuggestions: true
    target: _blank

- datetime:
    text_size: 2xl
    locale: en-GB
    format:
      weekday: short
      month: short
      day: numeric
      hour: 2-digit
      minute: 2-digit
      hourCycle: h23
