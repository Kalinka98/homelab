# Useful summaries first; every service group stays visible.
# Credentials are supplied by Compose, never stored in this file.
- At a glance:
    - Jellyfin:
        id: jellyfin
        icon: mdi-play-circle-outline
        href: https://jellyfin.kalinka.dev
        description: Your own private cinema
        siteMonitor: http://host.docker.internal:8096/health
        widget:
          type: jellyfin
          url: http://host.docker.internal:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
          enableUser: true
          enableMediaControl: false
          expandOneStreamToTwoRows: false
          showEpisodeNumber: true
          fields: [movies, series, episodes]

    - AdGuard Home:
        id: adguard
        icon: mdi-shield-check-outline
        href: https://adguard.kalinka.dev
        description: A quieter, cleaner internet
        server: local
        container: adguard
        widget:
          type: adguard
          url: http://adguard:3000
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
          fields: [queries, blocked, latency]

    - Uptime Kuma:
        id: uptime-kuma
        icon: mdi-heart-pulse
        href: https://status.kalinka.dev
        description: A pulse on your services
        server: local
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: homelab
          fields: [up, down, uptime]

- Media:
    - Sonarr:
        id: sonarr
        icon: mdi-television-classic
        href: https://sonarr.kalinka.dev
        description: The next episode awaits
        server: local
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
          enableQueue: true
          fields: [series, wanted, queued]

    - Radarr:
        id: radarr
        icon: mdi-filmstrip
        href: https://radarr.kalinka.dev
        description: Something for movie night
        server: local
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
          enableQueue: true
          fields: [movies, missing, queued]

    - qBittorrent:
        id: qbittorrent
        icon: mdi-download-network-outline
        href: https://qbittorrent.kalinka.dev
        description: Incoming, at a glance
        server: local
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://qbittorrent:8080
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
          enableLeechProgress: true
          enableLeechSize: true
          fields: [leech, download, seed, upload]

- Behind the scenes:
    - Prowlarr:
        id: prowlarr
        icon: mdi-magnify
        href: https://prowlarr.kalinka.dev
        description: Indexers & search health
        server: local
        container: prowlarr
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
          fields: [numberOfQueries, numberOfGrabs, numberOfFailQueries]

    - Bazarr:
        id: bazarr
        icon: mdi-subtitles-outline
        href: https://bazarr.kalinka.dev
        description: Subtitles still to find
        server: local
        container: bazarr
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
          fields: [missingEpisodes, missingMovies]

    - Dozzle:
        id: dozzle
        icon: mdi-console-line
        href: https://logs.kalinka.dev
        description: Follow the logs
        server: local
        container: dozzle

    - ntfy:
        id: ntfy
        icon: mdi-bell-outline
        href: https://notify.kalinka.dev
        description: The updates that matter
        server: local
        container: ntfy

    - SimpleSubGen:
        id: simplesubgen
        icon: mdi-auto-fix
        description: AI subtitle generation
        server: local
        container: simplesubgen

    - FlareSolverr:
        id: flaresolverr
        icon: mdi-puzzle-outline
        description: Indexer challenge resolver
        server: local
        container: flaresolverr

    - Caddy:
        id: caddy
        icon: mdi-lock-outline
        description: Your front door · proxy & TLS
        server: local
        container: caddy

    - Homepage:
        id: homepage
        icon: mdi-home-outline
        href: https://home.kalinka.dev
        description: Everything in its place
        server: local
        container: homepage
