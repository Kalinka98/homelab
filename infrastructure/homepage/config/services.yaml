    - AdGuard Home:
        icon: adguard-home.png
        href: http://192.168.0.61:3000/
        description: Network-wide DNS and ad blocking
        server: local
        container: adguard
        widget:
          type: adguard
          url: http://192.168.0.61:3000/
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
          fields:
            - queries
            - blocked
            - filtered
            - latency


