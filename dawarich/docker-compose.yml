
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  edge:
    external: true
    name: homelab-edge

  dawarich:
    driver: bridge

services:
  dawarich_redis:
    image: redis:7.4-alpine
    container_name: dawarich_redis
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    command: >
      redis-server
      --save 900 1
      --save 300 10
      --appendonly no

    volumes:
      - ./data/shared:/data:z

    networks:
      - dawarich

    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  dawarich_db:
    image: postgis/postgis:17-3.5-alpine
    container_name: dawarich_db
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    shm_size: 1gb

    environment:
      POSTGRES_USER: dawarich
      POSTGRES_PASSWORD: ${DAWARICH_DB_PASSWORD:?Required}
      POSTGRES_DB: dawarich

    volumes:
      - ./data/postgres:/var/lib/postgresql/data:z
      - ./data/shared:/var/shared:z

    networks:
      - dawarich

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dawarich -d dawarich
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  dawarich_app:
    image: freikin/dawarich:1.15.3
    container_name: dawarich_app
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    entrypoint: web-entrypoint.sh
    command: ["bin/rails", "server", "-p", "3000", "-b", "::"]

    environment: &dawarich-environment
      RAILS_ENV: production
      SELF_HOSTED: "true"

      TIME_ZONE: ${TZ:-Europe/Sofia}
      APPLICATION_HOSTS: dawarich.${BASE_DOMAIN},localhost,127.0.0.1
      APPLICATION_PROTOCOL: http

      SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE:?Required}

      DATABASE_HOST: dawarich_db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: dawarich
      DATABASE_PASSWORD: ${DAWARICH_DB_PASSWORD:?Required}
      DATABASE_NAME: dawarich

      REDIS_URL: redis://dawarich_redis:6379

      RAILS_LOG_TO_STDOUT: "true"
      STORE_GEODATA: "true"

      ALLOW_EMAIL_PASSWORD_REGISTRATION: "false"

      WEB_CONCURRENCY: "1"
      BACKGROUND_PROCESSING_CONCURRENCY: "3"

    volumes:
      - ./data/public:/var/app/public:z
      - ./data/watched:/var/app/tmp/imports/watched:z
      - ./data/storage:/var/app/storage:z
      - ./data/postgres:/dawarich_db_data:z

    expose:
      - "3000"

    networks:
      - edge
      - dawarich

    depends_on:
      dawarich_db:
        condition: service_healthy
      dawarich_redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO - http://127.0.0.1:3000/api/v1/health
          | grep -q ok
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  dawarich_sidekiq:
    image: freikin/dawarich:1.15.3
    container_name: dawarich_sidekiq
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    entrypoint: sidekiq-entrypoint.sh
    command: ["sidekiq"]

    environment:
      <<: *dawarich-environment

    volumes:
      - ./data/public:/var/app/public:z
      - ./data/watched:/var/app/tmp/imports/watched:z
      - ./data/storage:/var/app/storage:z

    networks:
      - dawarich

    depends_on:
      dawarich_db:
        condition: service_healthy
      dawarich_redis:
        condition: service_healthy
      dawarich_app:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  dawarich_db_data:
  dawarich_shared:
  dawarich_public:
  dawarich_watched:
  dawarich_storage:
