
name: Validate Homelab Configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Validate six Compose stacks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configurations
        run: make validate-examples

  caddy:
    name: Validate Caddy configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create external Docker networks
        run: |
          docker network create homelab-edge
          docker network create homelab-ai

      - name: Validate Caddyfile and imported sites
        working-directory: infrastructure
        run: |
          docker compose --env-file .env.example \
            run --rm --no-deps \
            --entrypoint caddy \
            caddy validate \
            --config /etc/caddy/Caddyfile \
            --adapter caddyfile
