x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  edge:
    external: true
    name: homelab-edge

  immich:
    driver: bridge

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.3.1
    container_name: immich-server
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      TZ: ${TZ}

      DB_HOSTNAME: immich-postgres
      DB_PORT: "5432"
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in .env}
      DB_DATABASE_NAME: immich

      REDIS_HOSTNAME: immich-valkey
      REDIS_PORT: "6379"

    volumes:
      - ${DATA_PATH:?Set DATA_PATH in .env}/immich:/data:Z
      - /etc/localtime:/etc/localtime:ro

    expose:
      - "2283"

    depends_on:
      immich-valkey:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy

    networks:
      - edge
      - immich

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
                - compute
                - video

    healthcheck:
      disable: false


  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.1-cuda
    container_name: immich-machine-learning
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      TZ: ${TZ}
      MACHINE_LEARNING_MODEL_REVISION: v2

    volumes:
      - immich-model-cache:/cache

    networks:
      - immich

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    healthcheck:
      disable: false


  immich-valkey:
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    container_name: immich-valkey
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    networks:
      - immich

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5


  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    restart: unless-stopped
    logging: *default-logging
    labels:
      kuma.__container: "true"

    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in .env}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"

    volumes:
      - ./postgres:/var/lib/postgresql/data:Z

    shm_size: 128mb

    networks:
      - immich

    healthcheck:
      disable: false


volumes:
  immich-model-cache:
